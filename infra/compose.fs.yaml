# Дополнение к compose.yaml для установки без MinIO: архив — каталог хоста PDM_FS_ARCHIVE_DIR,
# раскладка objects/<2 символа>/<sha256>. Не указывайте здесь папку данных MinIO (PDM_ARCHIVE_DIR).
# docker compose -f compose.yaml -f infra/compose.fs.yaml up -d --build
services:
  api:
    environment:
      PDM_STORAGE: fs
      PDM_BLOB_DIR: /archive
    volumes:
      - ${PDM_FS_ARCHIVE_DIR:?set PDM_FS_ARCHIVE_DIR (host folder for the file archive)}:/archive
