services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdm
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: ${PDM_DB_PASSWORD:?set PDM_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pdm -d pdm']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./infra/minio
      target: server
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: pdm-bootstrap
      MINIO_ROOT_PASSWORD: ${PDM_MINIO_ROOT_PASSWORD:?set PDM_MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: 'off'
    volumes:
      - minio-data:/data
    networks: [storage]
  minio-init:
    build:
      context: ./infra/minio
      target: client
    depends_on: [minio]
    networks: [storage]
    environment:
      PDM_MINIO_ROOT_PASSWORD: ${PDM_MINIO_ROOT_PASSWORD:?set PDM_MINIO_ROOT_PASSWORD in .env}
      PDM_S3_SECRET_KEY: ${PDM_S3_SECRET_KEY:?set PDM_S3_SECRET_KEY in .env}
    volumes:
      - ./infra/minio/pdm-policy.json:/policy.json:ro
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: [/bin/sh, /init.sh]
  api:
    build:
      context: .
      dockerfile: src/SolidBrew.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_HTTP_PORTS: '8080'
      PDM_DB_PASSWORD: ${PDM_DB_PASSWORD:?set PDM_DB_PASSWORD in .env}
      PDM_DB_HOST: postgres
      PDM_S3_ENDPOINT: http://minio:9000
      PDM_S3_ACCESS_KEY: pdm-api
      PDM_S3_SECRET_KEY: ${PDM_S3_SECRET_KEY:?set PDM_S3_SECRET_KEY in .env}
      PDM_API_TOKEN: ${PDM_API_TOKEN:?set PDM_API_TOKEN in .env}
    ports:
      - '127.0.0.1:8088:8080'
    networks: [default, storage]
networks:
  storage:
    internal: true
volumes:
  postgres-data:
  minio-data:
