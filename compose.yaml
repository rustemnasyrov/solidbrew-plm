# SolidBrew PDM: PostgreSQL и API. Архив содержимого — MinIO, установленный на хосте задачей планировщика
# (tools/Install-Server.ps1, вне Docker, данные в обычной папке PDM_ARCHIVE_DIR). MinIO слушает только 127.0.0.1:9000;
# Docker Desktop пересылает обращения контейнера к host.docker.internal на loopback хоста, поэтому API его видит, а ЛВС — нет.
# Клиенты подключаются по HTTPS (самоподписанный сертификат tools/New-ServerCert.ps1, доверие по отпечатку SHA-256).
# Без MinIO (лаборатория): docker compose -f compose.yaml -f infra/compose.fs.yaml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdm
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: ${PDM_DB_PASSWORD:?set PDM_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pdm -d pdm']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/SolidBrew.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDM_DB_HOST: postgres
      PDM_DB_PASSWORD: ${PDM_DB_PASSWORD:?set PDM_DB_PASSWORD in .env}
      PDM_APP_DB_PASSWORD: ${PDM_APP_DB_PASSWORD:?set PDM_APP_DB_PASSWORD in .env}
      PDM_BOOTSTRAP_ADMIN_PASSWORD: ${PDM_BOOTSTRAP_ADMIN_PASSWORD:?set PDM_BOOTSTRAP_ADMIN_PASSWORD in .env}
      PDM_STORAGE: s3
      PDM_S3_ENDPOINT: ${PDM_S3_ENDPOINT:-http://host.docker.internal:9000}
      PDM_S3_ACCESS_KEY: pdm-api
      PDM_S3_SECRET_KEY: ${PDM_S3_SECRET_KEY:?set PDM_S3_SECRET_KEY in .env}
      PDM_S3_BUCKET: pdm-objects
      # HTTPS 8443 — для клиентов; HTTP 8080 — только для диагностики с самого сервера (опубликован на 127.0.0.1).
      PDM_TLS_PFX_PATH: /certs/pdm-api.pfx
      PDM_TLS_PFX_PASSWORD: ${PDM_TLS_PFX_PASSWORD:?run tools/New-ServerCert.ps1 (sets PDM_TLS_PFX_PASSWORD in .env)}
      PDM_HTTPS_LISTEN_PORT: '8443'
      PDM_HTTP_LISTEN_PORT: '8080'
    volumes:
      - type: bind
        source: ${PDM_TLS_PFX_PATH:?run tools/New-ServerCert.ps1 (sets PDM_TLS_PFX_PATH in .env)}
        target: /certs/pdm-api.pfx
        read_only: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PDM_BIND_ADDRESS:-127.0.0.1}:${PDM_HTTPS_PORT:-8443}:8443'
      - '127.0.0.1:${PDM_HTTP_PORT:-8088}:8080'
    restart: unless-stopped
    networks: [default, storage]
networks:
  storage:
    internal: true
volumes:
  postgres-data:
